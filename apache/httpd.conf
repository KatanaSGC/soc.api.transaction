ServerRoot "/usr/local/apache2"
Listen 8080

# Load required modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule unixd_module modules/mod_unixd.so

ServerName localhost
ServerTokens Prod
ServerSignature Off

# Run as non-root user (required for OpenShift)
User daemon
Group daemon

# Error and access logs
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# Proxy configuration: forward all requests to the NestJS backend
<VirtualHost *:8080>
    ServerName localhost

    # Preserve the original Host header
    ProxyPreserveHost On

    # Disable proxy for the server status endpoint
    ProxyRequests Off

    # Forward requests to the NestJS application.
    # - In Docker Compose the backend is reachable via its service name.
    # - In OpenShift (sidecar/same pod) use http://localhost:3000/.
    # Adjust the target host to match your deployment topology.
    ProxyPass / http://soc-api-transaction:3000/
    ProxyPassReverse / http://soc-api-transaction:3000/

    # Inform the backend that the original request came over HTTPS
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

</VirtualHost>
