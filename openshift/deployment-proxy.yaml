apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-api-transaction-proxy
  labels:
    app: soc-api-transaction
    component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soc-api-transaction
      component: proxy
  template:
    metadata:
      labels:
        app: soc-api-transaction
        component: proxy
    spec:
      containers:
        - name: apache-proxy
          image: transaction-service-proxy:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
